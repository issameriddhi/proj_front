<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="buy.css">
    <title>Nexus Bloom | Buy Now</title>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <ul class="nav-menu">
                <li><a href="../homepage/homepage.html" class="nav-link">Home</a></li>
                <li><a href="../about/aboutus.html" class="nav-link">About Us</a></li>
                <li><a href="../donate/donate.html" class="nav-link">Donate</a></li>
                <li><a href="../profile/profile.html" class="nav-link">Profile</a></li>
                <li class="basket">
                    <img src="../assets/basket.png" alt="Basket Icon">
                    <span>Basket: </span><span id="basket-count">0</span> items
                </li>
            </ul>
        </nav>
    </header>

    <main class="buy-now-content">
        <div class="order-summary">
            <h1>Order Summary</h1>
            <div id="order-items" class="product-grid">
                <!-- Order items will be dynamically inserted here -->
            </div>
            <div class="order-total">
                <h3>Total: $<span id="total-price">0.00</span></h3>
            </div>
        </div>

        <form id="buy-now-form" class="order-form">
            <h2>Billing Information</h2>
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="fullName" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="address">Shipping Address:</label>
            <textarea id="address" name="address" required></textarea>

            <label for="payment-method">Payment Method:</label>
            <select id="payment-method" name="paymentMethod" required>
                <option value="credit-card">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank-transfer">Bank Transfer</option>
            </select>

            <!-- Hidden input for seller ID -->
            <input type="hidden" id="seller-id" name="sellerId" value="">

            <button type="submit">Complete Purchase</button>
        </form>
    </main>

    <footer class="footer">
        <div class="back-button">
            <button onclick="window.location.href='../cart/cart.html'">Back to Cart</button>
        </div>
    </footer>

    <script src="../scripts/buy.js"></script>
</body>
</html>
